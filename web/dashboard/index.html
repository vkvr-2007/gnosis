<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gnosis</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #121821; --line: #1f2a37; --text: #e6edf3; --muted: #8b98a8;
    --accent: #4cc9f0; --ok: #3ddc97; --warn: #f4a261; --bad: #ef476f; --local: #b388ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .08em; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  #status { color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 1fr 380px; gap: 16px; padding: 16px 20px; height: calc(100vh - 56px); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 0; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  #chat { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 9px 13px; border-radius: 12px; white-space: pre-wrap; }
  .you { align-self: flex-end; background: #1d3557; }
  .gnosis { align-self: flex-start; background: #17212c; border: 1px solid var(--line); }
  .err { align-self: flex-start; color: var(--bad); }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); align-items: center; }
  input[type=text] { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; }
  button { background: var(--accent); color: #001018; border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; font-weight: 600; cursor: pointer; }
  button.no { background: transparent; color: var(--text); border: 1px solid var(--line); }
  label { color: var(--muted); font-size: 13px; display: flex; gap: 4px; align-items: center; }
  aside { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  #approvals { padding: 10px 14px; display: flex; flex-direction: column; gap: 10px; }
  #approvals:empty::after { content: "Nothing waiting for you."; color: var(--muted); font-size: 13px; }
  .approval { border: 1px solid var(--warn); border-radius: 8px; padding: 10px; }
  .approval code { color: var(--warn); }
  .approval .btns { display: flex; gap: 8px; margin-top: 8px; }
  #activity { flex: 1; overflow-y: auto; padding: 10px 14px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
  .ev { color: var(--muted); }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; margin-right: 6px; }
  .cloud { background: #12384a; color: var(--accent); }
  .local { background: #2b1d4a; color: var(--local); }
  .allow { color: var(--ok); } .ask { color: var(--warn); } .deny { color: var(--bad); }
  .tabs { display: flex; gap: 4px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); }
  .tab { background: transparent; color: var(--muted); border-radius: 6px 6px 0 0; padding: 8px 12px; font-size: 13px; }
  .tab.active { color: var(--text); background: var(--bg); }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.active { display: flex; }
  #map { flex: 1; min-height: 280px; }
  #map text { fill: var(--text); font-size: 11px; }
  #map .subject circle { fill: #12384a; stroke: var(--accent); }
  #map .owner circle { fill: var(--accent); }
  #map .owner text { fill: #001018; font-weight: 700; }
  #map .fact circle { fill: #1b2430; stroke: var(--muted); }
  #map .fact.pinned circle { stroke: var(--ok); }
  #map .fact.sensitive circle { stroke: var(--bad); }
  #map line { stroke: var(--line); stroke-width: 1.5; }
  #facts { max-height: 40%; overflow-y: auto; border-top: 1px solid var(--line); padding: 8px 14px; font-size: 13px; }
  #facts:empty::after { content: "Gnosis doesn't remember anything yet. Tell it something about you."; color: var(--muted); }
  .fact-row { display: flex; gap: 8px; align-items: center; padding: 4px 0; }
  .fact-row span { flex: 1; }
  .fact-row.hl { background: #17212c; }
  .fact-row button { padding: 3px 8px; font-size: 12px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; height: auto; } #chat { min-height: 50vh; } }
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>GNOSIS</h1>
  <span id="status">connecting…</span>
</header>
<main>
  <section>
    <div class="tabs">
      <button class="tab active" data-view="talk">Conversation</button>
      <button class="tab" data-view="memory">Memory</button>
    </div>
    <div class="view active" id="view-talk">
      <div id="chat"></div>
      <form id="form">
        <input type="text" id="text" placeholder="Ask Gnosis anything…" autocomplete="off" autofocus>
        <label title="Keep this request on the local model"><input type="checkbox" id="private"> Private</label>
        <button>Send</button>
      </form>
    </div>
    <div class="view" id="view-memory">
      <svg id="map" viewBox="-400 -300 800 600" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="facts"></div>
    </div>
  </section>
  <aside>
    <section><h2>Needs your approval</h2><div id="approvals"></div></section>
    <section style="flex:1"><h2>Live activity</h2><div id="activity"></div></section>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
let wakeWord = "hey gnosis";
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function say(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
}

function activity(html) {
  const div = document.createElement("div");
  div.className = "ev";
  div.innerHTML = html;
  $("activity").prepend(div);
  while ($("activity").children.length > 200) $("activity").lastChild.remove();
}

function addApproval(ev) {
  const div = document.createElement("div");
  div.className = "approval";
  div.id = "ap-" + ev.approval_id;
  div.innerHTML = `<div><code>${esc(ev.tool)}</code> ${esc(JSON.stringify(ev.args))}</div>
    <div class="ev">${esc(ev.reason)}</div>
    <div class="btns"><button data-ok="1">Allow</button><button class="no" data-ok="0">Deny</button></div>`;
  div.querySelectorAll("button").forEach((b) => b.onclick = () =>
    fetch(`/api/approvals/${ev.approval_id}`, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({approved: b.dataset.ok === "1"})}));
  $("approvals").appendChild(div);
}

function onEvent(ev) {
  switch (ev.type) {
    case "model_call":
      activity(`<span class="badge ${ev.where}">${ev.where.toUpperCase()}</span>${esc(ev.model)} · ${ev.latency_ms} ms` +
               (ev.redactions ? ` · ${ev.redactions} redacted` : "") + (ev.reason !== "default" ? ` · ${esc(ev.reason)}` : ""));
      break;
    case "tool_call":
      activity(`→ <b>${esc(ev.tool)}</b> <span class="${ev.decision}">${ev.decision}</span>`);
      break;
    case "tool_result":
      activity(`← ${esc(ev.tool)} ${ev.ok ? "ok" : '<span class="deny">failed</span>'}`);
      break;
    case "approval_needed": addApproval(ev); break;
    case "approval_resolved": $("ap-" + ev.approval_id)?.remove(); break;
    case "memory_recalled":
      if (ev.facts.length || ev.episodes.length)
        activity(`◆ recalled ${ev.facts.length} facts, ${ev.episodes.length} past tasks`);
      break;
    case "voice_state": {
      if (ev.wake_word) wakeWord = ev.wake_word.replaceAll("_", " ");
      const labels = {loading: "loading voice…", idle: `say "${wakeWord}"`, listening: "listening…",
                      thinking: "thinking…", speaking: "speaking…"};
      $("status").textContent = "online · " + (labels[ev.state] || ev.state);
      break;
    }
    case "voice_heard":
      say("you", "🎙 " + ev.text + (ev.owner ? "" : "  (guest voice)"));
      break;
    case "voice_error":
      say("err", ev.error);
      break;
    case "task_finished":
      if (String(ev.session).endsWith("voice")) say("gnosis", ev.answer);
      // Learning runs just after the answer; refresh the map shortly after.
      if ($("view-memory").classList.contains("active")) setTimeout(loadMemory, 1500);
      break;
  }
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => { $("dot").classList.add("on"); $("status").textContent = "online"; };
  ws.onclose = () => { $("dot").classList.remove("on"); $("status").textContent = "reconnecting…"; setTimeout(connect, 2000); };
  ws.onmessage = (m) => onEvent(JSON.parse(m.data));
}

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("text").value.trim();
  if (!text) return;
  $("text").value = "";
  say("you", text);
  try {
    const r = await fetch("/api/chat", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text, private: $("private").checked})});
    const data = await r.json();
    r.ok ? say("gnosis", data.answer) : say("err", data.detail || "Something went wrong.");
  } catch (err) { say("err", "Can't reach Gnosis: " + err); }
};


// ---- Memory map ---------------------------------------------------------
document.querySelectorAll(".tab").forEach((t) => t.onclick = () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
  document.querySelectorAll(".view").forEach((v) => v.classList.toggle("active", v.id === "view-" + t.dataset.view));
  if (t.dataset.view === "memory") loadMemory();
});

const short = (s, n = 22) => s.length > n ? s.slice(0, n - 1) + "…" : s;
const SVG = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent) {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}

function layout(graph) {
  // You at the centre, your own facts on an inner ring, other people/things on an outer ring
  // with their facts clustered around them.
  const pos = {"s:owner": [0, 0]};
  const children = {};
  graph.edges.forEach((e) => { if (e.to.startsWith("f:")) (children[e.from] ||= []).push(e.to); });
  const others = graph.nodes.filter((n) => n.kind === "subject" && n.id !== "s:owner");
  others.forEach((n, i) => {
    const a = (2 * Math.PI * i) / Math.max(others.length, 1) - Math.PI / 2;
    pos[n.id] = [250 * Math.cos(a), 200 * Math.sin(a)];
  });
  for (const [subject, facts] of Object.entries(children)) {
    const [cx, cy] = pos[subject] || [0, 0];
    const r = subject === "s:owner" ? 130 : 70;
    const base = Math.atan2(cy, cx);
    facts.forEach((f, i) => {
      const a = subject === "s:owner" ? (2 * Math.PI * i) / facts.length + Math.PI / 4
                                      : base + ((i - (facts.length - 1) / 2) * 0.7);
      pos[f] = [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    });
  }
  return pos;
}

function drawMap(graph) {
  const svg = $("map");
  svg.innerHTML = "";
  const pos = layout(graph);
  const lines = el("g", {}, svg), dots = el("g", {}, svg);
  graph.edges.forEach((e) => {
    if (!pos[e.from] || !pos[e.to]) return;
    el("line", {x1: pos[e.from][0], y1: pos[e.from][1], x2: pos[e.to][0], y2: pos[e.to][1]}, lines);
  });
  graph.nodes.forEach((n) => {
    const [x, y] = pos[n.id] || [0, 0];
    const cls = n.id === "s:owner" ? "owner" : n.kind + (n.pinned ? " pinned" : "") + (n.sensitive ? " sensitive" : "");
    const g = el("g", {class: cls, transform: `translate(${x},${y})`, style: "cursor:pointer"}, dots);
    el("circle", {r: n.kind === "subject" ? 26 : 7}, g);
    const t = el("text", {"text-anchor": "middle", y: n.kind === "subject" ? 4 : 20}, g);
    t.textContent = short(n.label, n.kind === "subject" ? 10 : 24);
    el("title", {}, g).textContent = n.label;
    if (n.fact_id) g.onclick = () => {
      document.querySelectorAll(".fact-row").forEach((r) => r.classList.toggle("hl", r.dataset.id == n.fact_id));
      document.querySelector(`.fact-row[data-id="${n.fact_id}"]`)?.scrollIntoView({block: "nearest"});
    };
  });
}

async function factAction(id, method, body) {
  await fetch(`/api/memory/facts/${id}`, {method, headers: {"Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined});
  loadMemory();
}

async function loadMemory() {
  const [graph, mem] = await Promise.all([
    fetch("/api/memory/graph").then((r) => r.json()),
    fetch("/api/memory").then((r) => r.json()),
  ]);
  drawMap(graph);
  $("facts").innerHTML = "";
  mem.facts.forEach((f) => {
    const row = document.createElement("div");
    row.className = "fact-row";
    row.dataset.id = f.id;
    const who = f.subject === "owner" ? "You" : f.subject;
    row.innerHTML = `<span>${f.sensitive ? "🔒 " : ""}<b>${esc(who)}</b> · ${esc(f.predicate.replaceAll("_", " "))}: ${esc(f.value)}</span>
      <button class="no">${f.pinned ? "Unpin" : "Pin"}</button><button class="no">Forget</button>`;
    const [pin, forget] = row.querySelectorAll("button");
    pin.onclick = () => factAction(f.id, "PATCH", {pinned: !f.pinned});
    forget.onclick = () => confirm(`Forget "${who} ${f.predicate.replaceAll("_", " ")}: ${f.value}"?`) && factAction(f.id, "DELETE");
    $("facts").appendChild(row);
  });
}

fetch("/api/approvals").then((r) => r.json()).then((list) =>
  list.forEach((a) => addApproval({approval_id: a.id, ...a})));
connect();
</script>
</body>
</html>
