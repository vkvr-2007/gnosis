[project]
name = "gnosis"
version = "2.0.0.dev1"
description = "Gnosis: a Windows desktop assistant you talk to, powered by NVIDIA Nemotron."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The desktop window and tray icon. Kept optional so the core and its tests run anywhere.
app = [
    "pywebview>=5.0",
    "pystray>=0.19",
    "pillow>=10",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
gnosis = "gnosis.__main__:main"

[project.gui-scripts]
gnosis-app = "gnosis.__main__:main"

[tool.setuptools.packages.find]
include = ["gnosis*"]

[tool.setuptools.package-data]
"gnosis.app" = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
