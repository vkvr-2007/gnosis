[project]
name = "gnosis"
version = "0.1.0"
description = "Gnosis: a private, always-on personal agent for Windows, powered by NVIDIA Nemotron on Nebius Token Factory."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "openai>=1.40",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gnosis = "gnosis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gnosis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
