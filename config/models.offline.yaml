# Runs every role on the local model: for testing without a Nebius key, or fully offline.
# Use it by adding this line to config/gnosis.yaml:
#   models_file: config/models.offline.yaml
#
# Start llama.cpp first (Vulkan build on Intel Iris). --jinja turns on tool calling:
#   llama-server -m nvidia_Llama-3.1-Nemotron-Nano-4B-v1.1-Q4_K_M.gguf --port 8081 --jinja -c 8192
# The model's built-in chat template is broken (its tool calls are never closed with "}", and it drops
# every system message after the first), so llama.cpp can't load it. Use the corrected copy in this repo:
#   --chat-template-file config/templates/nemotron-nano-4b-v1.1.jinja
#
# Expect slow replies (tens of seconds on Iris Xe) and less reliable tool calls than Nemotron Super.
# Screenshot tools need a vision model, so they won't work in this mode.

providers:
  local:
    base_url: http://127.0.0.1:8081/v1/
    api_key_env: null
    on_device: true
    timeout_s: 300
  local_embed:
    base_url: http://127.0.0.1:8082/v1/
    api_key_env: null
    on_device: true

# A 4B model reads every tool description on every call, so it only gets the everyday tools.
# All 55 tools add about 6,000 tokens: a minute or more per call on Iris Xe, and worse tool choices.
everyday_tools: &everyday_tools
  [get_time, system_info, remember, search_memory, forget, open_app, close_app, list_windows,
   focus_window, look_at_window, click, type_text, press_keys, read_screen, play_music,
   set_reminder, list_reminders]

roles:
  planner: { provider: local, model: nemotron-nano-local, system_prefix: "detailed thinking off", temperature: 0, tools: *everyday_tools }
  fast:    { provider: local, model: nemotron-nano-local, system_prefix: "detailed thinking off", temperature: 0, tools: *everyday_tools }
  vision:  { provider: local, model: nemotron-nano-local }
  local:   { provider: local, model: nemotron-nano-local, system_prefix: "detailed thinking off", temperature: 0, tools: *everyday_tools }
  embed:   { provider: local_embed, model: nomic-embed-text }

routing:
  private_tags: [private, personal_memory, screen_text, voice_id, local_files, phone_data]
  offline_fallback: []
