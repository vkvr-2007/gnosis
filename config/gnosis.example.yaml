# Copy to config/gnosis.yaml and edit. Secrets come from environment variables, never this file.
server:
  host: 127.0.0.1
  port: 8765

data_dir: ~/.gnosis            # On Windows this resolves to %USERPROFILE%\.gnosis

models_file: config/models.yaml
policy_file: config/policy.yaml

kill_switch: ctrl+alt+j        # Global hotkey that stops everything Gnosis is doing

orchestrator:
  max_steps: 25                # Tool-call rounds per request before Gnosis stops and reports
  approval_timeout_s: 120      # How long an "ask" waits for your answer before it's treated as "no"
  max_parallel: 4              # Requests that can run at the same time (desktop tasks still take turns)

phone:
  # Where the phone reaches Gnosis. Best: Tailscale on both devices, then `tailscale serve --bg 8765`
  # on the laptop and put its https://<laptop>.<tailnet>.ts.net address here (HTTPS is needed for
  # notifications and the microphone). Without it, set server.host to 0.0.0.0 to use your Wi-Fi.
  url: null
  adb: true                    # Phone control over ADB (scripts\get_adb.ps1, then `gnosis phone pair`)

coder:
  distro: Gnosis               # The WSL distro scripts\setup_wsl.ps1 creates
  isolated: null               # Override whether code_run counts as sandboxed (true inside a container)

proactive:
  morning_briefing: "08:00"    # Spoken briefing every day; null turns it off
  quiet_hours: "23:00-07:00"   # Only urgent things interrupt; the rest waits for the briefing
  max_per_hour: 4              # Non-urgent notifications per hour before Gnosis holds them back
  phone_push: away             # Also notify the phone: away (no input for 5 min) | always | never
  check_every_s: 60            # How often the watchers look at battery and disk
  watchers:
    battery: true
    disk: true
    windows_update: true       # Checks for new Windows updates
    updates_every_h: 6

voice:
  wake_model: null             # null = listen for "Hey Gnosis" with a tiny on-device Whisper; or a path to a trained hey_gnosis.onnx
  wake_stt_model: tiny.en      # The Whisper model that listens for "Hey Gnosis"
  wake_threshold: 0.5          # Raise if it wakes by accident, lower if it misses you
  stt_model: small.en          # base.en is faster on slower laptops, small.en is more accurate
  # ElevenLabs instead of the on-device models (needs ELEVENLABS_API_KEY). What you say after the wake word,
  # and the spoken replies, then go to ElevenLabs. The wake word always stays on the laptop.
  stt: local                   # local | elevenlabs
  tts: local                   # local | elevenlabs
  elevenlabs_voice: null       # A voice ID from your ElevenLabs voice library; null = "George"
  piper_voice: ~/.gnosis/voices/en_GB-alan-medium.onnx   # Missing file = built-in Windows voice
  voice_id: true               # Only the enrolled owner can give owner-level commands by voice
  voice_id_threshold: 0.30
  follow_up_s: 4               # Keep listening this long after answering, without the wake word
  talk_key: ctrl+space         # Press to talk (also interrupts Gnosis); null turns it off
  barge_in: true               # Saying a new request over Gnosis interrupts it ("stop" and "wait" always do)
  input_device: null           # null = default microphone
  output_device: null
