# Gnosis policy: the model proposes, this file decides.
# Decisions: allow | ask | deny. Unknown tools default to "ask".

default: ask

tools:
  get_time: allow
  system_info: allow
  remember: allow
  search_memory: allow
  forget: allow              # Your own data; the dashboard also lets you forget anything
  list_tasks: allow
  pause_task: allow
  resume_task: allow
  cancel_task: allow
  set_reminder: allow
  list_reminders: allow
  cancel_reminder: allow
  do_not_disturb: allow
  briefing: allow
  schedule_routine: ask       # It will act later without you watching, so it asks once when you set it up
  # Desktop. Clicking a button like "Send", "Buy" or "Delete" asks first even though click is allowed.
  open_app: allow
  close_app: allow
  list_windows: allow
  focus_window: allow
  look_at_window: allow
  click: allow
  type_text: allow
  press_keys: allow
  play_music: allow
  read_screen: allow          # Text stays on the laptop (local model)
  look_at_screen: ask_once    # Sends a screenshot to the cloud vision model: asked once per app
  vision_click: ask_once
  read_file: allow
  write_file: ask
  delete_file: ask
  send_message: ask
  run_shell_windows: ask
  run_shell_sandbox: allow
  git_push: ask
  deploy: ask
  purchase: deny
  edit_policy: deny

# What someone other than the owner may ask for by voice (voice ID didn't match).
guest_tools: [get_time, open_app, close_app, play_music, set_volume]

filesystem:
  read:  ["~/Documents", "~/Desktop", "~/Downloads", "~/.gnosis/workspace"]
  write: ["~/Documents/Gnosis", "~/.gnosis/workspace"]
  deny:  ["~/.ssh", "~/.gnosis/vault", "C:/Windows"]

network:
  allow: ["*.nebius.com", "api.github.com", "*.vercel.com", "registry.npmjs.org", "pypi.org"]
