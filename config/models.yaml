# Model routing for Gnosis.
# Model IDs change; run `python -m gnosis models` to list the Nemotron models your Nebius key can use,
# then paste the exact IDs below.

providers:
  nebius:
    # Nebius Token Factory, OpenAI-compatible.
    base_url: https://api.tokenfactory.nebius.com/v1/
    api_key_env: NEBIUS_API_KEY
  local:
    # llama.cpp server (Vulkan build on Intel Iris), started with --jinja so tool calling works:
    #   llama-server -m nemotron-nano-q4.gguf --port 8081 --jinja -c 8192
    base_url: http://127.0.0.1:8081/v1/
    api_key_env: null
    on_device: true
    timeout_s: 300  # Reading Gnosis's prompt and tools takes a while on a laptop GPU
  local_embed:
    base_url: http://127.0.0.1:8082/v1/
    api_key_env: null
    on_device: true

roles:
  planner:   { provider: nebius, model: nvidia/nemotron-3-super }   # Long plans, tool calling
  fast:      { provider: nebius, model: nvidia/nemotron-3-nano }    # Routing, short replies
  vision:    { provider: nebius, model: nvidia/nemotron-nano-vl }   # Screenshots and images
  local:     { provider: local,  model: nemotron-nano-local,        # Private and offline work
               system_prefix: "detailed thinking off" }             # Nemotron Nano: answer without long reasoning
  # Memory search embeddings, on-device only. Start a second llama.cpp server with an embedding model:
  #   llama-server -m nomic-embed-text-v1.5.Q8_0.gguf --embeddings --port 8082
  # Without it, memory search uses keyword search alone.
  embed:     { provider: local_embed, model: nomic-embed-text }

routing:
  # Requests tagged with any of these never leave the laptop.
  private_tags: [private, personal_memory, screen_text, voice_id, local_files, phone_data]
  # Roles that may fall back to the local model when Nebius is unreachable.
  offline_fallback: [planner, fast]
